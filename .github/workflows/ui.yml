name: Browser UI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    # Browser revisions, fonts and OS match the approved PNG references.
    container: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
    env:
      UI_VISUAL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:ui
      - run: npm run test:install
        env:
          UI_INSTALL_BROWSER: '1'
