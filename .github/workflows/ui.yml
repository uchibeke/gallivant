name: Browser UI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/ubuntu-apt
      # The exact Playwright version in npm-shrinkwrap.json pins Chromium too.
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:ui
