name: Runtime portability
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install Linux verification sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Select sandbox-supported macOS Git runtime
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Library/Developer/CommandLineTools
      - name: Verify native isolation before the suite
        run: node test/verification-host.mjs
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
