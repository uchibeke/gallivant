name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/runtime-portability.yml
  publish:
    needs: validate
    if: github.repository == 'uchibeke/gallivant'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Require a public repository and an exact main-backed release
        id: release
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          test "$REPOSITORY_PRIVATE" = false || { echo 'Make the repository public before publishing with provenance.'; exit 1; }
          VERSION="$(node -p "require('./package.json').version")"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          TAG="v$VERSION"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main
          else
            test "$GITHUB_REF" = "refs/tags/$TAG"
          fi
          git fetch origin main --tags
          git merge-base --is-ancestor HEAD origin/main
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: npm install --global npm@11
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:install
      - name: Pack the validated source
        run: |
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
      - name: Publish or verify an identical existing release
        env:
          # First release may use a short-lived granular token. Once npm trusted
          # publishing is configured, remove it; npm uses GitHub OIDC instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/publish-release.mjs
      - name: Create GitHub release with the installed artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes "dist/"*.tgz
          fi
