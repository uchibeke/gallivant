name: Locked CI dependencies
description: Set up a supported Node version and install the locked development dependencies.
inputs:
  node:
    description: Node version for this CI job
    default: '22'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node }}
        cache: npm
    - shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund
